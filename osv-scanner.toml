# OSV-Scanner ignore list (applied via --config in .github/workflows/security.yml).
#
# Only advisories with NO available fix in our dependency tree are ignored, each
# with a rationale. Everything fixable is fixed (npm via pnpm overrides in the
# root package.json; Cargo via pinned versions in Cargo.lock). Re-evaluate the
# entries below whenever Tauri upgrades its Linux GTK stack.

# ── Tauri 2.x Linux GTK stack: "unmaintained" advisories, no fixed version ──
# These crates are pulled transitively by Tauri 2.x's GTK3 bindings on Linux.
# gtk-rs deprecated them; there is no fixed release and no app-level remediation
# until Tauri migrates its windowing stack.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0411" # gdkwayland-sys — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0412" # gdk — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0413" # atk — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0414" # gdkx11-sys — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0415" # gtk — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0416" # atk-sys — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0417" # gdkx11 — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0418" # gdk-sys — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0419" # gtk3-macros — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0420" # gtk-sys — unmaintained (Tauri GTK stack)


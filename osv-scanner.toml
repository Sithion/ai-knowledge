[[IgnoredVulns]]
id = "RUSTSEC-2024-0414" # gdkx11-sys — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0415" # gtk — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0416" # atk-sys — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0417" # gdkx11 — unmaintained (Tauri GTK stack)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0418" # gdk-sys — unmaintained (Tauri GTK stack)

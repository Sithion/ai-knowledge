# Continuous dependency updates + vulnerability alerts.
# Complements the OSV-Scanner CI job (.github/workflows/security.yml): OSV gates
# PRs/scans on known vulns, Dependabot opens the bump PRs that resolve them.
version: 2
updates:
  # npm / pnpm workspace (root pnpm-lock.yaml covers all apps + packages).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Rust / Tauri shell.
  - package-ecosystem: "cargo"
    directory: "/apps/dashboard/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by our workflows (keeps the SHA pins current).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

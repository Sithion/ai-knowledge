name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**']
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — weekly full dependency vulnerability scan

permissions:
  contents: read

env:
  # OSV-Scanner pin; bump both together. SHA256 is for osv-scanner_linux_amd64
  # from https://github.com/google/osv-scanner/releases (osv-scanner_SHA256SUMS).
  OSV_SCANNER_VERSION: '2.3.8'
  OSV_SCANNER_SHA256: 'bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc'

jobs:
  version-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Get PR version
        id: pr
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          path: main-branch
      - name: Get main version
        id: main
        run: echo "version=$(node -p "require('./main-branch/package.json').version")" >> $GITHUB_OUTPUT
      - name: Check version was bumped
        run: |
          if [ "${{ steps.pr.outputs.version }}" = "${{ steps.main.outputs.version }}" ]; then
            echo "::error::Version not bumped! PR version (${{ steps.pr.outputs.version }}) is the same as main. Bump the version in all package.json files and Cargo.toml before merging."
            exit 1
          fi
          echo "Version bumped: ${{ steps.main.outputs.version }} → ${{ steps.pr.outputs.version }}"

  # Prevents the publish job (publish.yml, runs post-merge on push to main) from
  # failing with "ReleaseAsset already_exists". That happens when the desktop
  # release is rebuilt for a version that already has a published GitHub release.
  # Complements version-check (which only proves root/package.json changed vs main):
  # this asserts all release-driving version sources agree AND the tag is unpublished.
  release-version-guard:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
      - name: Check release version sources are in sync
        run: node scripts/check-release-version.mjs
      - name: Ensure release tag is not already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./apps/dashboard/package.json').version")
          TAG="v${VERSION}"
          # GitHub Releases API: 200 = release exists (would collide), 404 = safe.
          # Fail closed on anything else (403 rate-limit, 5xx, 000 timeout) so a
          # transient error never lets a colliding version slip through.
          STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 15 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
          case "$STATUS" in
            404)
              echo "✓ No existing release for ${TAG} — safe to publish."
              ;;
            200)
              echo "::error::Release ${TAG} already exists. The publish job would fail with 'ReleaseAsset already_exists' on its assets. Bump the version (pnpm bump <new-version>) before merging."
              exit 1
              ;;
            *)
              echo "::error::Could not verify release status for ${TAG} (HTTP ${STATUS}). Failing closed — re-run the job or check the GitHub API."
              exit 1
              ;;
          esac

  validate-dependencies:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate external dependency URLs
        run: |
          FAILED=0
          check_url() {
            STATUS=$(curl -sIL -o /dev/null -w "%{http_code}" "$1" --max-time 15 2>/dev/null)
            if [ "$STATUS" != "200" ]; then
              echo "::error::$2 returned HTTP $STATUS: $1"
              FAILED=1
            else
              echo "✓ $2 (HTTP $STATUS)"
            fi
          }
          check_url "https://ollama.com/install.sh" "Ollama install script"
          check_url "https://api.github.com/repos/Sithion/cognistore/releases/latest" "GitHub Releases API"
          if [ "$FAILED" -ne 0 ]; then exit 1; fi

  build-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run tests
        run: cd packages/tests && npx playwright test --reporter=list
      - name: Dry-run npm publish (fail on warnings)
        run: |
          OUTPUT=$(cd apps/mcp-server && npm publish --dry-run --access public 2>&1)
          echo "$OUTPUT"
          WARNINGS=$(echo "$OUTPUT" | grep "npm warn publish" | grep -v "script name was cleaned" | grep -v "auto-corrected some errors" | grep -v "errors corrected" || true)
          if [ -n "$WARNINGS" ]; then
            echo "$WARNINGS"
            echo "::error::npm publish dry-run produced warnings. Fix package.json before merging."
            exit 1
          fi

  # Free dependency vulnerability scanning via OSV-Scanner (osv.dev). Covers npm
  # (pnpm-lock.yaml) and Cargo (apps/dashboard/src-tauri/Cargo.lock) in one pass.
  # Runs on every PR/push and the weekly schedule. Self-contained (no third-party
  # Action) to respect the repo's curated Actions allowlist; the binary is
  # version-pinned and checksum-verified. This job is a required status check.
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install OSV-Scanner (pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o osv-scanner
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Scan dependencies (npm + Cargo lockfiles)
        # Recursively finds every lockfile (.gitignore honoured, so node_modules
        # and target/ are skipped). Exits non-zero on a known vulnerability, which
        # fails the check. --config applies osv-scanner.toml (the ignore list of
        # no-fix/unmaintained advisories) across all lockfiles.
        run: ./osv-scanner --config=osv-scanner.toml -r ./

name: Security

# Free dependency vulnerability scanning via OSV-Scanner (osv.dev). Covers both
# ecosystems in this repo in one pass: npm (pnpm-lock.yaml) and Cargo
# (apps/dashboard/src-tauri/Cargo.lock).
#
# Self-contained on purpose: the repo restricts Actions to a curated allowlist,
# so instead of a third-party Action we use only actions/checkout (allowed) plus
# the official OSV-Scanner release binary, version-pinned and checksum-verified.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

env:
  # Pin the scanner; bump both together. SHA256 is for osv-scanner_linux_amd64
  # from https://github.com/google/osv-scanner/releases (osv-scanner_SHA256SUMS).
  OSV_SCANNER_VERSION: '2.3.8'
  OSV_SCANNER_SHA256: 'bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc'

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install OSV-Scanner (pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o osv-scanner
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: Scan dependencies (npm + Cargo lockfiles)
        # Recursively finds every lockfile (.gitignore is honoured, so node_modules
        # and target/ are skipped). Exits non-zero when a known vulnerability is
        # found, which fails the check. --config applies osv-scanner.toml (the
        # ignore list of no-fix/unmaintained advisories) across all lockfiles.
        run: ./osv-scanner --config=osv-scanner.toml -r ./

name: Security

# Free dependency vulnerability scanning via OSV-Scanner (osv.dev).
# Covers both ecosystems in this repo in one pass: npm (pnpm-lock.yaml) and
# Cargo (apps/dashboard/src-tauri/Cargo.lock).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

# No permissions by default; each job widens only what it needs.
permissions: {}

jobs:
  # On PRs: diff-aware scan that flags only the vulnerabilities a PR *introduces*,
  # so pre-existing advisories never block an unrelated change.
  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8

  # On push to main + weekly: full recursive scan of every lockfile; results are
  # uploaded to the repository Security tab (Code scanning).
  scan-full:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
